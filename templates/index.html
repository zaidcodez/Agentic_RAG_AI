<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intellectra - Intelligent Chat</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- KaTeX (Math) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Highlight.js (Code) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="brand">
            <div class="brand-icon">
                <i class="ri-flashlight-fill"></i>
            </div>
            <span class="brand-name">Intellectra</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
            <i class="ri-add-line"></i> New Chat
        </button>
        <div class="search-container">
            <i class="ri-search-line"></i>
            <input type="text" id="historySearch" placeholder="Search chats..." autocomplete="off">
        </div>
        <div class="history-list" id="historyList">
            <div style="padding: 10px; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-top: 10px;">Recent</div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <header>
            <button class="menu-btn" id="menuBtn">
                <i class="ri-menu-line"></i>
            </button>
            <div class="header-title" id="sessionTitle">Current Session</div>
            <div>
                <i id="themeToggleBtn" class="ri-sun-line" style="cursor: pointer; color: var(--text-muted); font-size: 1.2rem; transition: color 0.3s;"></i>
            </div>
        </header>

        <!-- Chat Timeline Navigator -->
        <div id="chat-timeline" class="chat-timeline"></div>

        <div id="messages-container"></div>

        <!-- Scroll Nav Button -->
        <button id="scrollNavBtn" class="scroll-btn">
            <i class="ri-arrow-down-line"></i>
        </button>

        <div id="input-wrapper">
            <div class="input-box">
                <div id="pinned-context-container" class="pinned-context-container"></div>
                <div id="upload-container" class="upload-container" style="display: none;">
                    <div class="upload-file-info">
                        <i class="ri-file-text-line"></i>
                        <span id="upload-filename">filename.pdf</span>
                    </div>
                    <div class="upload-progress-wrapper">
                        <svg class="upload-progress-ring" viewBox="0 0 36 36">
                            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="ring-fill" id="upload-ring" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <span id="upload-percentage">0%</span>
                    </div>
                    <button id="cancel-upload-btn" title="Cancel Upload"><i class="ri-close-line"></i></button>
                </div>
                <div class="input-container">
                <div id="pinned-context-container" class="pinned-context-container" style="display: none;"></div>
                <div class="input-main-row">
                    <button class="action-btn" id="plusBtn" title="More Tools">
                        <i class="ri-add-line"></i>
                    </button>
                    <div class="hidden-tools" id="hiddenTools">
                        <button class="action-btn" id="attachBtn" title="Upload Document">
                            <i class="ri-attachment-2"></i>
                        </button>
                        <input type="file" id="fileInput" accept=".pdf,.docx,.ppt,.pptx" />
                        <div class="custom-dropdown">
                            <button class="action-btn" id="studyLevelBtn" title="Study Mode">
                                <i class="ri-graduation-cap-line"></i>
                            </button>
                            <div class="dropdown-menu" id="studyLevelMenu">
                                <div class="dropdown-item active" data-value="standard">Standard</div>
                                <div class="dropdown-item" data-value="eli5">ELI5 (Simple)</div>
                                <div class="dropdown-item" data-value="advanced">Advanced</div>
                            </div>
                        </div>
                    </div>
                    <textarea id="query" placeholder="Message Intellectra..." rows="1"></textarea>
                    <button class="action-btn send-btn" id="sendBtn">
                        <i class="ri-send-plane-fill"></i>
                    </button>
                </div>
                <div class="input-footer-row">
                    <button class="mode-toggle-btn" id="modeSelectBtn">
                        <div class="mode-text-wrapper" id="modeTextWrapper">
                            <span class="mode-text-item active" id="currentModeText">Standard</span>
                        </div>
                        <i class="ri-arrow-right-s-line"></i>
                    </button>
                    <label class="concept-check-toggle" title="Generate a Concept Check instead of a normal response">
                        <input type="checkbox" id="conceptCheckToggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Concept Check</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- App Logic -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
