<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>They're Watching | Intellectra</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="script.js"></script>
</head>

<body>
  <!-- Sidebar toggle (left) -->
  <button id="menuBtn" title="Menu" aria-label="Toggle sidebar">☰</button>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h3>Chats</h3>
      <button id="closeSidebar" title="Close sidebar">×</button>
    </div>

    <div id="sidebar-actions">
      <button id="newChatBtn">+ New Chat</button>
      <input type="text" id="searchChats" placeholder="Search chats..." />
    </div>

    <div id="chatList">
      <div class="chat-item">Chat Title 1</div>
      <div class="chat-item">Chat Title 2</div>
      <div class="chat-item">Chat Title 3</div>
    </div>
  </aside>

  <!-- Theme toggle (top-right) -->
  <div id="themeToggleWrap">
    <button id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <!-- svg icon inserted by JS -->
    </button>
  </div>

  <!-- Chat wrapper -->
  <div id="chat-wrapper" class="alert shadow-inset alert-secondary">
    <h2>INTELLECTRA 🤖</h2>

    <!-- Messages -->
    <div id="messages" role="log" aria-live="polite"></div>

    <!-- <div id="upload-chips"></div> -->

    <!-- Input area -->
    <div id="input-area">
      <!-- Attach button -->
      <button id="attachBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Attach">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden>
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <!-- popup -->
      <div id="file-popup" aria-hidden="true">
        <label class="popup-item">
          <input type="file" id="file-image" accept="image/*" hidden>
          <span class="popup-icon">🖼️</span><span class="popup-text">Image</span>
        </label>
        <label class="popup-item">
          <input type="file" id="file-doc" accept=".pdf,.doc,.docx,.txt" hidden>
          <span class="popup-icon">📄</span><span class="popup-text">Document</span>
        </label>
        <label class="popup-item">
          <input type="file" id="file-any" hidden>
          <span class="popup-icon">📁</span><span class="popup-text">File</span>
        </label>
      </div>

      <!-- text -->
      <textarea id="query" placeholder="Type your question..." rows="1" aria-label="Message"></textarea>

      <!-- send -->
      <button id="sendBtn" type="button" title="Send message">Send</button>
    </div>

    <!-- attached file preview -->
    <div id="attached-area" aria-live="polite"></div>
  </div>
  <div id="notification"></div>
</body>

</html>
